name: DescarGO — compilar para Windows

# - En cada cambio de descargo/**: pruebas + instalador como artefacto.
# - Al crear una etiqueta «descargo-vX.Y.Z»: además se publica en GitHub Releases,
#   que es donde la app busca sus actualizaciones.
on:
  push:
    branches: ["**"]
    paths:
      - "descargo/**"
      - ".github/workflows/descargo-windows.yml"
    tags:
      - "descargo-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: descargo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0
      - name: Dependencias de Python
        run: pip install -r requirements.txt pytest
      - name: Pruebas
        run: python -m pytest -q tests

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: descargo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar (FFmpeg verificado + PyInstaller + instalador)
        shell: pwsh
        run: ./build_windows.ps1
      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: DescarGO-Setup-Windows
          path: descargo/dist/DescarGO-Setup-*
      - name: Publicar versión portable
        uses: actions/upload-artifact@v4
        with:
          name: DescarGO-Portable-Windows
          path: descargo/dist/DescarGO/

  release:
    if: startsWith(github.ref, 'refs/tags/descargo-v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar que la etiqueta coincide con la versión de la app
        working-directory: descargo
        run: |
          APP=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('descargo/__init__.py', encoding='utf-8').read()).group(1))")
          TAG="${GITHUB_REF_NAME#descargo-v}"
          echo "App: $APP  Etiqueta: $TAG"
          test "$APP" = "$TAG"
      - uses: actions/download-artifact@v4
        with:
          name: DescarGO-Setup-Windows
          path: release
      - name: Verificar huella SHA-256
        working-directory: release
        run: sha256sum -c DescarGO-Setup-*.exe.sha256
      - name: Crear la publicación
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python descargo/tools/release_notes.py > notes.md
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "DescarGO ${GITHUB_REF_NAME#descargo-v}" --notes-file notes.md
